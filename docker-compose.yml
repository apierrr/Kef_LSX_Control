services:
  kef-control:
    build: .
    image: kef-control:latest
    container_name: kef-control
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      # IP de l'enceinte KEF LSX sur le LAN — valeur réelle dans .env (non versionné)
      KEF_IP: "${KEF_IP:-192.168.1.12}"
      KEF_PORT: "${KEF_PORT:-50001}"
